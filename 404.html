  <script>
    // Short tag URLs: petnudge.fr/p/<id> resolves the pet finder page.
    // GitHub Pages has no dynamic routing, so it serves 404.html for these
    // paths; redirect straight to the canonical profile view before anything
    // paints. Legacy pet.html?id=<id> links keep working unchanged.
    (function () {
      var m = location.pathname.match(/^\/p\/([A-Za-z0-9]+)\/?$/);
      if (m) { location.replace('/pet.html?id=' + m[1]); return; }
      // Activated tags: petnudge.fr/t/<CODE> resolves the linked pet's profile.
      var t = location.pathname.match(/^\/t\/([A-Za-z0-9]+)\/?$/);
      if (t) { location.replace('/pet.html?tag=' + t[1].toUpperCase()); }
    })();
  </script>
